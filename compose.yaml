services:
  generator:
    platform: linux/arm64
    build:
      context: .
      args:
        MODEL: Arm/qwen3-0-6b-onnx-genai-int4-kquantlast-emb-int4
      secrets:
        - hf_token
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

secrets:
  hf_token:
    environment: HF_TOKEN

x-topo:
  name: "Text Generator (ONNX Runtime GenAI)"
  description: |
    An on-device evaluation harness for Arm-optimized generative ONNX models.
    Deploy a compatible Hugging Face model to an Arm Target, generate text
    through a Gradio web interface, and measure time to first token and decode
    throughput on the Target CPU. The Target does not require a GPU.
  deployment_success_message: |
    Text Generator (ONNX Runtime GenAI) is starting.

    Run `topo ps` and wait until the generator service reports a healthy status.
    Then open http://<target-ip>:7860 in your browser to enter a prompt.
  parameters:
    MODEL:
      description: "Hugging Face repository containing config.yaml and an ONNX Runtime GenAI bundle"
      default: "Arm/qwen3-0-6b-onnx-genai-int4-kquantlast-emb-int4"
      hints:
        huggingface.task: text-generation
        file.format: onnx
